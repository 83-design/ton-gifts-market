name: Deploy TON Gifts Market to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare static export
        run: |
          rm -rf src/app/api
          npx prisma generate

      - name: Build static site
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_TON_CONNECT_MANIFEST_URL: 'https://83-design.github.io/ton-gifts-market/tonconnect-manifest.json'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
